<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Precios — Guadalupe Victoria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b91c1c;--red2:#d32f2f;--blue:#1565c0;--green:#237a3b;--bg:#f4f7fb;--paper:#fff;--ink:#14243a;--muted:#64748b;--line:#dbe5ef;--shadow:0 10px 28px rgba(15,23,42,.09)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{touch-action:manipulation}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;box-shadow:0 8px 22px rgba(185,28,28,.22)}
.head{max-width:900px;margin:auto;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:21px;font-weight:1000}.small{font-size:12px;opacity:.9;margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:14px 14px 120px}.notice{background:#fff7df;border:1px solid #f1d991;border-radius:15px;padding:10px 12px;font-size:13px;font-weight:800;color:#755400;margin-bottom:12px}.notice.ok{background:#ebf8ef;border-color:#b8e0c1;color:#28633a}.notice.bad{background:#fff0f0;border-color:#f3c0c0;color:#8d2525}
.search{width:100%;border:2px solid var(--line);background:#fff;border-radius:17px;padding:15px 16px;font-size:18px;outline:none;box-shadow:var(--shadow)}.search:focus{border-color:var(--blue)}
.cats{display:flex;gap:8px;overflow:auto;padding:11px 0 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{flex:0 0 auto;border:2px solid #cfe0ef;background:#fff;color:#174e7e;padding:11px 14px;border-radius:999px;font-weight:1000;cursor:pointer}.cat.active{background:var(--blue);border-color:var(--blue);color:#fff}
.list{display:grid;gap:10px}.product{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.product.off{opacity:.58}.name{font-size:19px;font-weight:1000;line-height:1.15}.meta{font-size:12px;color:var(--muted);font-weight:800;margin-top:5px}.price{font-size:28px;font-weight:1000;color:#0c5b9e;text-align:right}.change{grid-column:1/-1;border:0;background:#eef6ff;color:#0e568f;border-radius:14px;padding:12px;font-size:16px;font-weight:1000;cursor:pointer}.change:active{transform:scale(.99)}
.empty{text-align:center;background:#fff;border:1px dashed #c8d5e3;border-radius:18px;padding:32px 16px;color:var(--muted);font-weight:900}
.fab{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:18;max-width:872px;margin:auto;border:0;border-radius:18px;padding:16px 18px;background:var(--green);color:#fff;font-size:18px;font-weight:1000;box-shadow:0 14px 34px rgba(35,122,59,.28);cursor:pointer}
.backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.58);z-index:50;padding:14px;align-items:center;justify-content:center}.modal{width:min(520px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.28)}.modalHead{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.modalTitle{font-size:20px;font-weight:1000}.x{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:20px;font-weight:1000;cursor:pointer}.modalBody{padding:16px}.label{display:block;font-size:12px;font-weight:1000;color:#4c6277;text-transform:uppercase;margin:0 0 7px}.field{margin-bottom:14px}.input{width:100%;border:2px solid #cbd9e6;border-radius:15px;padding:15px 14px;font-size:19px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(21,101,192,.10)}.bigPrice{font-size:34px;font-weight:1000;text-align:center}.current{text-align:center;color:var(--muted);font-weight:900;margin-bottom:10px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.qbtn{border:1px solid #cbd9e6;background:#fff;color:#174e7e;border-radius:13px;padding:11px 5px;font-weight:1000;cursor:pointer}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:2px solid #cbd9e6;background:#fff;color:#304b65;border-radius:14px;padding:13px 8px;font-weight:1000;cursor:pointer}.choice.active{border-color:var(--blue);background:#eef6ff;color:#0e568f}.advanced{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}.advToggle{border:0;background:transparent;color:#526a81;font-weight:900;padding:6px 0;cursor:pointer}.advBox{display:none;margin-top:8px}.advBox.show{display:block}.checkrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:11px;border-radius:13px;font-weight:850;margin-top:8px}.checkrow input{width:20px;height:20px}.danger{border:0;background:#fff1f1;color:#9d2020;border-radius:13px;padding:12px 14px;font-weight:1000;cursor:pointer;width:100%;margin-top:10px}.modalFoot{padding:13px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr;gap:9px}.btn{border:0;border-radius:15px;padding:14px;font-size:17px;font-weight:1000;cursor:pointer}.cancel{background:#eef2f6;color:#40566d}.save{background:var(--green);color:#fff}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;z-index:90;background:#18344f;color:#fff;padding:12px 16px;border-radius:999px;font-weight:1000;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.head{padding:11px 12px}.brand{font-size:18px}.product{padding:13px}.name{font-size:18px}.price{font-size:25px}.quick{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="head"><div><div class="brand">💲 Productos y precios</div><div class="small">Toca un producto para cambiar su precio</div></div></div></header>
<div class="wrap">
  <div class="notice" id="status">Cargando productos…</div>
  <input class="search" id="search" placeholder="🔎 Buscar producto" autocomplete="off">
  <div class="cats" id="cats"></div>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="newBtn">＋ AGREGAR PRODUCTO NUEVO</button>

<div class="backdrop" id="priceBackdrop"><div class="modal">
  <div class="modalHead"><div class="modalTitle" id="priceTitle">Cambiar precio</div><button class="x" data-close="priceBackdrop">×</button></div>
  <div class="modalBody">
    <div class="current" id="currentPrice"></div>
    <label class="label">Nuevo precio</label>
    <input class="input bigPrice" id="priceInput" type="number" min="0" step="1" inputmode="decimal">
    <div class="quick"><button class="qbtn" data-add="-10">− $10</button><button class="qbtn" data-add="-5">− $5</button><button class="qbtn" data-add="5">＋ $5</button><button class="qbtn" data-add="10">＋ $10</button></div>
    <button class="danger" id="hideBtn">Ocultar este producto</button>
  </div>
  <div class="modalFoot"><button class="btn cancel" data-close="priceBackdrop">Cancelar</button><button class="btn save" id="savePriceBtn">GUARDAR PRECIO</button></div>
</div></div>

<div class="backdrop" id="newBackdrop"><div class="modal">
  <div class="modalHead"><div class="modalTitle">Nuevo producto</div><button class="x" data-close="newBackdrop">×</button></div>
  <div class="modalBody">
    <div class="field"><label class="label">1. Nombre</label><input class="input" id="newName" placeholder="Ej. Taco de suadero"></div>
    <div class="field"><label class="label">2. Categoría</label><div class="choiceGrid" id="newCats"></div><input class="input" id="newCatOther" placeholder="Otra categoría" style="margin-top:8px;display:none"></div>
    <div class="field"><label class="label">3. Precio</label><input class="input bigPrice" id="newPrice" type="number" min="0" step="1" inputmode="decimal" placeholder="$0"></div>
    <div class="advanced"><button class="advToggle" id="advToggle">⚙️ Más opciones</button><div class="advBox" id="advBox">
      <label class="checkrow"><input type="checkbox" id="newKitchen" checked> Se imprime en cocina</label>
      <label class="checkrow"><input type="checkbox" id="newNote"> Necesita indicaciones especiales</label>
    </div></div>
  </div>
  <div class="modalFoot"><button class="btn cancel" data-close="newBackdrop">Cancelar</button><button class="btn save" id="saveNewBtn">GUARDAR PRODUCTO</button></div>
</div></div>

<div class="toast" id="toast">Guardado</div>
<script>
const SUPABASE_URL="https://rcegikeiaxptolrduguc.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyZWYiOiJyY2VnaWtlaWF4cHRvbHJkdWd1YyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzU1NjUzMjA3LCJleHAiOjIwNzEyMjkyMDd9.jbPM9F977zeITEmFA_xvVU6SCxlWWVCi3Dx7ZhFfTp8";
// Use the same public anon key as the existing Mesas/Admin files.
const REAL_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZWdpa2VpYXhwdG9scmR1Z3VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU2NTMyMDcsImV4cCI6MjA3MTIyOTIwN30.jbPM9F977zeITEmFA_xvVU6SCxlWWVCi3Dx7ZhFfTp8";
const sb=window.supabase.createClient(SUPABASE_URL,REAL_ANON_KEY);
let products=[],activeCat="TODOS",editing=null,newCat="";
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function money(v){return new Intl.NumberFormat("es-MX",{style:"currency",currency:"MXN",maximumFractionDigits:2}).format(Number(v||0))}
function open(id){$(id).style.display="flex";document.body.style.overflow="hidden"}
function close(id){$(id).style.display="none";document.body.style.overflow=""}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function setStatus(t,type=""){$('status').textContent=t;$('status').className='notice'+(type?' '+type:'')}
function slug(s){return String(s||'producto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'producto'}
async function loadProducts(){setStatus('Cargando productos…');const {data,error}=await sb.from('catalogo_productos').select('*').order('orden',{ascending:true}).order('nombre',{ascending:true});if(error){setStatus('No se pudieron cargar los productos.','bad');$('list').innerHTML='<div class="empty">Revisa la conexión o la tabla catalogo_productos.</div>';return}products=data||[];renderCats();renderList();setStatus(`${products.filter(p=>p.activo!==false).length} productos activos. Los cambios se reflejan en Mesas.`,'ok')}
function categories(){return [...new Set(products.map(p=>p.categoria).filter(Boolean))]}
function renderCats(){const cats=['TODOS',...categories()];if(activeCat!=='TODOS'&&!cats.includes(activeCat))activeCat='TODOS';$('cats').innerHTML=cats.map(c=>`<button class="cat ${c===activeCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderCats();renderList()})}
function renderList(){const q=$('search').value.trim().toLowerCase();const rows=products.filter(p=>(activeCat==='TODOS'||p.categoria===activeCat)&&(!q||`${p.nombre} ${p.categoria}`.toLowerCase().includes(q))).sort((a,b)=>(a.activo===false)-(b.activo===false));if(!rows.length){$('list').innerHTML='<div class="empty">No encontré productos.</div>';return}$('list').innerHTML=rows.map(p=>`<div class="product ${p.activo===false?'off':''}"><div><div class="name">${esc(p.nombre)}</div><div class="meta">${esc(p.categoria)}${p.activo===false?' · OCULTO':''}</div></div><div class="price">${money(p.precio)}</div><button class="change" data-edit="${esc(p.id)}">${p.activo===false?'EDITAR / VOLVER A MOSTRAR':'CAMBIAR PRECIO'}</button></div>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openPrice(b.dataset.edit))}
function openPrice(id){const p=products.find(x=>x.id===id);if(!p)return;editing=p;$('priceTitle').textContent=p.nombre;$('currentPrice').textContent=`Precio actual: ${money(p.precio)}`;$('priceInput').value=Number(p.precio||0);$('hideBtn').textContent=p.activo===false?'Volver a mostrar este producto':'Ocultar este producto';$('hideBtn').style.background=p.activo===false?'#eaf8ee':'#fff1f1';$('hideBtn').style.color=p.activo===false?'#236738':'#9d2020';open('priceBackdrop');setTimeout(()=>$('priceInput').select(),80)}
async function savePrice(){if(!editing)return;const price=Number($('priceInput').value);if(!Number.isFinite(price)||price<0)return alert('Escribe un precio válido.');const {error}=await sb.from('catalogo_productos').update({precio:price}).eq('id',editing.id);if(error)return alert('No se pudo guardar: '+error.message);close('priceBackdrop');toast('Precio guardado');editing=null;await loadProducts()}
async function toggleEditing(){if(!editing)return;const next=editing.activo===false;const text=next?'¿Volver a mostrar este producto en Mesas?':'¿Ocultar este producto de Mesas?';if(!confirm(text))return;const {error}=await sb.from('catalogo_productos').update({activo:next}).eq('id',editing.id);if(error)return alert('No se pudo guardar: '+error.message);close('priceBackdrop');toast(next?'Producto visible':'Producto oculto');editing=null;await loadProducts()}
function openNew(){$('newName').value='';$('newPrice').value='';$('newCatOther').value='';$('newCatOther').style.display='none';$('newKitchen').checked=true;$('newNote').checked=false;$('advBox').classList.remove('show');newCat='';renderNewCats();open('newBackdrop')}
function renderNewCats(){const cats=categories().filter(Boolean);$('newCats').innerHTML=cats.map(c=>`<button type="button" class="choice ${newCat===c?'active':''}" data-newcat="${esc(c)}">${esc(c)}</button>`).join('')+`<button type="button" class="choice ${newCat==='OTRA'?'active':''}" data-newcat="OTRA">OTRA</button>`;document.querySelectorAll('[data-newcat]').forEach(b=>b.onclick=()=>{newCat=b.dataset.newcat;$('newCatOther').style.display=newCat==='OTRA'?'block':'none';const kitchenDefault=!['BEBIDAS','POSTRES'].includes(newCat);$('newKitchen').checked=kitchenDefault;renderNewCats()})}
async function saveNew(){const name=$('newName').value.trim();const cat=(newCat==='OTRA'?$('newCatOther').value.trim():newCat).toUpperCase();const price=Number($('newPrice').value);if(!name)return alert('Escribe el nombre del producto.');if(!cat)return alert('Selecciona una categoría.');if(!Number.isFinite(price)||price<0)return alert('Escribe un precio válido.');const maxOrder=products.reduce((m,p)=>Math.max(m,Number(p.orden||0)),0);const payload={id:`${slug(name)}_${Date.now().toString(36)}`,categoria:cat,nombre:name,precio:price,descripcion:'',requiere_nota:$('newNote').checked,cocina:$('newKitchen').checked,activo:true,orden:maxOrder+10,bebida_con_presentacion:false};const {error}=await sb.from('catalogo_productos').insert(payload);if(error)return alert('No se pudo guardar: '+error.message);close('newBackdrop');toast('Producto agregado');await loadProducts()}
$('search').oninput=renderList;$('newBtn').onclick=openNew;$('savePriceBtn').onclick=savePrice;$('hideBtn').onclick=toggleEditing;$('saveNewBtn').onclick=saveNew;$('advToggle').onclick=()=>{$('advBox').classList.toggle('show')};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{$('priceInput').value=Math.max(0,Number($('priceInput').value||0)+Number(b.dataset.add||0))});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.backdrop').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)close(bg.id)}));
loadProducts();try{sb.channel('catalog-simple').on('postgres_changes',{event:'*',schema:'public',table:'catalogo_productos'},()=>loadProducts()).subscribe()}catch(e){console.warn(e)}
</script>
</body>
</html>
